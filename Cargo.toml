[workspace]
resolver = "2"
members = ["crates/unitn-core", "crates/unitn"]
# The experimental Android build has its own lock file (see its Cargo.toml).
exclude = ["crates/unitn-android"]

[workspace.package]
version = "0.5.13"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/boka89/Unitn"
rust-version = "1.80"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
