name: Android (experimental)

# Builds the Android test APK, starts it in an emulator with a radio stream
# and publishes screenshots and the app log to the ci-android branch.
on:
  push:
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/android.yml"
      - ".github/scripts/android-*.sh"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android APK + emulator
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: crates/unitn-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build APK
        env:
          # The permanent signing key (repository secrets). Without them the
          # build still works, signed with a throw-away test key.
          KEYSTORE_B64: ${{ secrets.UNITN_ANDROID_KEYSTORE_B64 }}
          UNITN_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.UNITN_ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/unitn-release.p12"
            export UNITN_ANDROID_KEYSTORE="$RUNNER_TEMP/unitn-release.p12"
          fi
          .github/scripts/android-build.sh
          apk=$(ls dist/android/Unitn_*_android.apk | head -1)
          "$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner" verify --print-certs "$apk" > "$RUNNER_TEMP/certs.txt" 2>/dev/null || true

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: unitn-android-apk
          path: |
            dist/android/*.apk
            dist/android/Cargo.lock
          if-no-files-found: error

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Make test songs
        run: python3 .github/scripts/android-test-songs.py test-songs

      - name: Run in the emulator (Android 14, phone and tablet size)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          profile: pixel_c
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/android-emulator.sh

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: android-screenshots
          path: android-screenshots/

      # Experimental public download: a pre-release (never "Latest", so the
      # desktop downloads on the website are unaffected) with the APK signed
      # with the permanent key. Only from android-spike, and only when the
      # emulator run above passed.
      - name: Publish the experimental APK (pre-release "android-preview")
        if: github.event_name == 'push' && github.ref_name == 'android-spike' && success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HAS_KEY: ${{ secrets.UNITN_ANDROID_KEYSTORE_B64 != '' }}
        run: |
          set -e
          if [ "$HAS_KEY" != "true" ]; then
            echo "RESULT android publish: SKIPPED (no permanent signing key)"; exit 0
          fi
          apk=$(ls dist/android/Unitn_*_android.apk | head -1)
          version=$(basename "$apk" | sed -E 's/^Unitn_(.*)_android\.apk$/\1/')
          cp "$apk" dist/android/unitn-android-experimental.apk
          cat > "$RUNNER_TEMP/notes.md" <<EOF
          **Experimental Android build of Unitn player ${version}.** Not tested on a real phone yet.

          | File | |
          |---|---|
          | \`unitn-android-experimental.apk\` | Android 8.0 or newer, ARM64 phones and tablets (also x86_64) |

          **Install:** download the APK on your phone, open it, and allow your browser or file manager to
          *install unknown apps* when Android asks. Updates install over the old version (same signing key).

          **Checked in the Android 14 emulator:** the phone layout on every page, local music from the
          Music and Download folders, playback in the background with a media notification and
          lock-screen/headset controls, internet radio, and the hand-over to the browser for the Plex sign-in.

          **Not tested yet:** real phones (some makers' battery savers may stop playback), Bluetooth and
          headset hardware, long screen-off playback, slow phones. Please report what you find in
          [Issues](https://github.com/boka89/Unitn/issues).

          Certificate SHA-256: \`$(grep -m1 -i 'SHA-256 digest:' "$RUNNER_TEMP/certs.txt" 2>/dev/null | sed 's/.*: *//' || true)\`

          Built from \`${GITHUB_SHA::7}\` on the \`android-spike\` branch.
          EOF
          sed -i 's/^          //' "$RUNNER_TEMP/notes.md"
          gh release delete android-preview --cleanup-tag --yes 2>/dev/null || true
          gh release create android-preview \
            --target "$GITHUB_SHA" --prerelease --latest=false \
            --title "Unitn player ${version} for Android (experimental)" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            dist/android/unitn-android-experimental.apk
          echo "RESULT android publish: OK (${version})"

      - name: Publish screenshots to the ci-android branch
        if: github.event_name == 'push' && always()
        run: |
          set -e
          [ -d android-screenshots ] || mkdir android-screenshots
          dir=$(mktemp -d)
          cp -r android-screenshots "$dir/"
          [ -f dist/android/Cargo.lock ] && cp dist/android/Cargo.lock "$dir/Cargo.android.lock"
          cd "$dir"
          echo "${GITHUB_SHA} (${GITHUB_REF_NAME})" > COMMIT
          git init -q -b ci-android
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -qm "Android emulator run for ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" ci-android
